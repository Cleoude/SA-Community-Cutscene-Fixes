[Settings]
; Motorbike cops in the countryside and desert. The game normally restricts them to the three
; cities; this puts the same 30-50 second patrol rotation on the rural level too.
Enabled=1

; Ped model the rural bike cop uses. 283 = csher, the Ranger sheriff, no helmet.
; 284 = lapdm1, the stock helmeted city motor cop.
RiderModel=284

; How long a stretch of bike patrols lasts before it rotates back to cars, and vice versa.
; The stock game uses 30 to 50.
MinSeconds=30
MaxSeconds=50
